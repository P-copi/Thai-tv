plugins { id 'com.android.application' }

def tvBoxBuild = project.hasProperty('tvbox')

android { namespace 'com.pcopi.thaitvnew'; compileSdk 35
    defaultConfig {
        applicationId tvBoxBuild ? 'com.pcopi.thaitvnew.tv' : 'com.pcopi.thaitvnew'
        minSdk 23
        targetSdk tvBoxBuild ? 28 : 35
        versionCode tvBoxBuild ? 4 : 3
        versionName tvBoxBuild ? '2.1-TV' : '2.1'
        buildConfigField 'boolean', 'TV_BOX_BUILD', tvBoxBuild ? 'true' : 'false'
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
