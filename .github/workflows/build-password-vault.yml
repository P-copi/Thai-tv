name: Build My Password Vault
on:
  workflow_dispatch:
  push:
    paths:
      - 'PasswordVault/**'
      - '.github/workflows/build-password-vault.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/password-vault-release.jks"
          test -s "$RUNNER_TEMP/password-vault-release.jks"

      - name: Build signed release APK
        working-directory: PasswordVault
        env:
          PV_KEYSTORE_FILE: ${{ runner.temp }}/password-vault-release.jks
          PV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$PV_KEYSTORE_PASSWORD"
          test -n "$PV_KEY_ALIAS"
          test -n "$PV_KEY_PASSWORD"
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify signed APK
        run: |
          test -s PasswordVault/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs PasswordVault/app/build/outputs/apk/release/app-release.apk

      - name: Upload V5 signed APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Password-Vault-V5-signed
          path: PasswordVault/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
