name: Build My Password Vault
on:
  workflow_dispatch:
  push:
    paths:
      - 'PasswordVault/**'
      - '.github/workflows/build-password-vault.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: PasswordVault
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK
        run: test -s PasswordVault/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Password-Vault-v1-debug
          path: PasswordVault/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
