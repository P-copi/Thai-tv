name: Build Thai TV APK v1.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-v1.4-GitHub-APK.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v1.4 project
        run: |
          unzip -o ThaiTVPlayer-v1.4-GitHub-APK.zip
          test -f ThaiTVPlayer-v1.4/app/src/main/java/com/pcopi/thaitv/MainActivity.java
          echo "=== Android project extracted ==="
          find ThaiTVPlayer-v1.4 -maxdepth 6 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find ./ThaiTVPlayer-v1.4 -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix and validate v1.4 Java source
        working-directory: ./ThaiTVPlayer-v1.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/pcopi/thaitv/MainActivity.java')
          text = p.read_text(encoding='utf-8')
          text = text.replace('e.errorCodeName', 'e.errorCode')
          lines = text.splitlines()
          fixed_quote = False
          for n, line in enumerate(lines):
              if 'line.charAt(i)' in line and 'line.length()' in line:
                  lines[n] = "        if(i<line.length()&&(line.charAt(i)=='\"'||line.charAt(i)=='\\'')) {"
                  fixed_quote = True
          if not fixed_quote:
              raise SystemExit('ERROR: quote parser line not found')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('Applied Java compatibility fixes')
          PY
          echo "=== Relevant Java lines ==="
          grep -n -E "charAt\(i\)|errorCode" app/src/main/java/com/pcopi/thaitv/MainActivity.java
          echo "=== App build.gradle ==="
          cat app/build.gradle
          echo "=== AndroidManifest.xml ==="
          cat app/src/main/AndroidManifest.xml
          echo "=== Check for obsolete errorCodeName ==="
          if grep -R -n "errorCodeName" app/src/main/java; then
            echo "ERROR: obsolete PlaybackException.errorCodeName remains"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK v1.4
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex' | head
          echo "APK BUILD VERIFIED: $APK"

      - name: Upload APK v1.4
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v1.4-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
