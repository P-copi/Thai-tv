name: Build Thai TV APK v1.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-v1.4-GitHub-APK.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v1.4 project
        run: |
          unzip -o ThaiTVPlayer-v1.4-GitHub-APK.zip
          echo "=== Files after extraction ==="
          find . -maxdepth 6 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find ./ThaiTVPlayer-v1.4 -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix v1.4 Java source
        working-directory: ./ThaiTVPlayer-v1.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/pcopi/thaitv/MainActivity.java')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          changed = False
          for n, line in enumerate(lines):
              if 'line.charAt(i)' in line and 'line.length()' in line and 'charAt(i)' in line:
                  if '==' in line and ('\\\\\'' in line or '\\\\' in line):
                      lines[n] = "        if(i<line.length()&&(line.charAt(i)=='\"'||line.charAt(i)=='\\'')) {"
                      changed = True
          if not changed:
              raise SystemExit('ERROR: Could not locate the malformed quote parser line')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('Fixed MainActivity.java quote parser escaping')
          PY
          echo "=== Parser line after fix ==="
          grep -n "line.charAt(i)" app/src/main/java/com/pcopi/thaitv/MainActivity.java
          echo "=== App build.gradle ==="
          cat app/build.gradle
          echo "=== AndroidManifest.xml ==="
          cat app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK v1.4
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'AndroidManifest.xml|classes.dex' | head

      - name: Upload APK v1.4
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v1.4-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
