name: Build Thai TV APK v1.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-v1.4-GitHub-APK.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v1.4 project
        run: |
          unzip -o ThaiTVPlayer-v1.4-GitHub-APK.zip
          echo "=== Files after extraction ==="
          find . -maxdepth 6 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK v1.4
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK v1.4
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v1.4-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
