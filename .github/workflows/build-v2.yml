name: Build Thai TV Player v2

on:
  push:
    branches: [ build-v2 ]
  workflow_dispatch:

concurrency:
  group: thai-tv-player-v2-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: ThaiTVPlayer-v2
        run: gradle clean assembleDebug --stacktrace --warning-mode all
      - name: Verify APK
        working-directory: ThaiTVPlayer-v2
        run: |
          set -eux
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v2-debug
          path: ThaiTVPlayer-v2/app/build/outputs/apk/debug/app-debug.apk
