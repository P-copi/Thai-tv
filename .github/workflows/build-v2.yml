name: Build Thai TV Player v2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-v2/**'
      - '.github/workflows/build-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build v2 APK
        working-directory: ThaiTVPlayer-v2
        run: gradle clean assembleDebug --stacktrace --warning-mode all
      - name: Verify APK
        working-directory: ThaiTVPlayer-v2
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex' | head
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v2-debug
          path: ThaiTVPlayer-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
