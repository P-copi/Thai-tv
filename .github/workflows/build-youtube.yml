name: Build YouTube Private APK

on:
  push:
    paths:
      - 'YouTubePrivate/**'
      - '.github/workflows/build-youtube.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YouTubePrivate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePrivate-debug
          path: YouTubePrivate/app/build/outputs/apk/debug/app-debug.apk
