name: Build Thai TV Player New

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-New/**'
      - '.github/workflows/build-thai-tv-player.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix landscape player visibility
        run: python3 ThaiTVPlayer-New/patch-landscape.py

      - name: Build debug APK
        working-directory: ThaiTVPlayer-New
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK exists
        run: test -s ThaiTVPlayer-New/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-New-v3.1-landscape-fix-debug
          path: ThaiTVPlayer-New/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
