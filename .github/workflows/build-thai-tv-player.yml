name: Build Thai TV Player New

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-New/**'
      - '.github/workflows/build-thai-tv-player.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix landscape root visibility
        run: sed -i '/normalPanel.setVisibility/d' ThaiTVPlayer-New/app/src/main/java/com/pcopi/thaitvnew/MainActivity.java

      - name: Build debug APK
        working-directory: ThaiTVPlayer-New
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-New-v3.1-debug
          path: ThaiTVPlayer-New/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
