name: Archive My Password Vault V6.2

on:
  push:
    paths:
      - '.github/workflows/archive-password-vault-v62.yml'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact V6.2 source backup
        shell: bash
        run: |
          set -euo pipefail
          V62_SHA='a63f8593cc720706a56089e91a4b749a0620f8f5'
          rm -rf backup-src
          mkdir -p backup-src
          git archive "$V62_SHA" PasswordVault .github/workflows/build-password-vault.yml | tar -x -C backup-src
          cat > backup-src/RECOVERY_INFO.txt <<'EOF'
          My Password Vault V6.2 source backup
          Original repository: P-copi/Thai-tv
          Exact V6.2 commit: a63f8593cc720706a56089e91a4b749a0620f8f5
          Package: com.pcopi.passwordvault
          Version: 6.2
          Version code: 13
          Build Java: 17
          Gradle used by GitHub Actions: 8.9
          Minimum Android SDK: 26
          Target/Compile SDK: 35

          The signing keystore and passwords are intentionally NOT included in this public-repository artifact.
          Preserve them separately in a private backup.
          EOF
          git log --date=iso --pretty=format:'%H | %ad | %s' -- PasswordVault .github/workflows/build-password-vault.yml > backup-src/PASSWORD_VAULT_HISTORY.txt
          (cd backup-src && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_SOURCE.txt)
          (cd backup-src && zip -9 -r ../My-Password-Vault-V6.2-Source-Exact.zip .)
          sha256sum My-Password-Vault-V6.2-Source-Exact.zip > My-Password-Vault-V6.2-Source-Exact.zip.sha256

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: My-Password-Vault-V6.2-Source-Exact
          path: |
            My-Password-Vault-V6.2-Source-Exact.zip
            My-Password-Vault-V6.2-Source-Exact.zip.sha256
          if-no-files-found: error
          retention-days: 7
