name: Build Thai TV Player v1.5.0
on:
  workflow_dispatch:
  push:
    paths:
      - 'ThaiTVPlayer-v1.4.1/**'
      - '.github/workflows/build-v1.4.1.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: ThaiTVPlayer-v1.4.1
        run: gradle clean assembleDebug --stacktrace --warning-mode all
      - name: Verify APK
        working-directory: ThaiTVPlayer-v1.4.1
        run: test -s app/build/outputs/apk/debug/app-debug.apk && ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v1.5.0-debug
          path: ThaiTVPlayer-v1.4.1/app/build/outputs/apk/debug/app-debug.apk
