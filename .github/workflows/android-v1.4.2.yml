name: Build Thai TV Player v1.4.2

on:
  push:
    paths:
      - 'ThaiTVPlayer-v1.4.1/**'
      - '.github/workflows/android-v1.4.2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ThaiTVPlayer-v1.4.1
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTVPlayer-v1.4.2-debug
          path: ThaiTVPlayer-v1.4.1/app/build/outputs/apk/debug/*.apk
